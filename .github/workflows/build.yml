name: "Build isideload"

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-latest"
            artifact_name: "minimal"
            asset_name: "minimal-linux"
          - platform: "windows-latest"
            artifact_name: "minimal.exe"
            asset_name: "minimal-windows.exe"
          - platform: "macos-latest"
            artifact_name: "minimal"
            asset_name: "minimal-macos"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.platform }}-isideload-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.platform }}-isideload-cargo-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev

      - name: Test bundle rewrite logic
        run: cargo test -p isideload --lib

      - name: Build
        run: cargo build -p minimal

      - name: Upload manual candidate binary
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/debug/${{ matrix.artifact_name }}
          retention-days: 2
