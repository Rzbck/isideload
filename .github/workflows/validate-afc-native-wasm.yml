name: Validate AFC native and WASM

on:
  push:
    branches:
      - validation/afc-native-chunks-20260914
  workflow_dispatch:

jobs:
  native-check:
    name: Native check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev

      - name: Check isideload
        run: cargo check -p isideload

      - name: Check formatting
        run: cargo fmt --all --check

  wasm-check:
    name: WASM check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable with WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Check WASM
        run: >
          cargo check
          -p isideload
          --no-default-features
          --features install,wasm,fs-storage
          --target wasm32-unknown-unknown